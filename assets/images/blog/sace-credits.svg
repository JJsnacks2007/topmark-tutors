<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640" role="img" aria-label="How the 200 SACE credits are made up, including compulsory subjects">
<rect width="1160" height="640" fill="#fbf7ee"/>
<text x="60" y="66" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#12152b" letter-spacing="-1">The SACE = 200 credits</text>
<text x="60" y="102" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#697386">50 compulsory credits + at least 60 credits of Stage 2 subjects + your own choices</text>
<rect x="60" y="150" width="46" height="86" rx="14" fill="#3658ff"/><rect x="112" y="150" width="98" height="86" rx="14" fill="#5c7cff"/><rect x="216" y="150" width="46" height="86" rx="14" fill="#8a63ff"/><rect x="268" y="150" width="46" height="86" rx="14" fill="#17a37b"/><rect x="320" y="150" width="306" height="86" rx="14" fill="#f6c453"/><rect x="632" y="150" width="462" height="86" rx="14" fill="#c9cede"/>

<g transform="translate(60,300)">
<rect x="0" y="-20" rx="10" width="30" height="30" fill="#3658ff"/>
<text x="46" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#12152b">Exploring Identities &amp; Futures</text>
<text x="620" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="900" fill="#12152b">10 credits</text>
<text x="790" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#697386">Stage 1 compulsory</text>
</g>
<g transform="translate(60,352)">
<rect x="0" y="-20" rx="10" width="30" height="30" fill="#5c7cff"/>
<text x="46" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#12152b">Literacy</text>
<text x="620" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="900" fill="#12152b">20 credits</text>
<text x="790" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#697386">Stage 1 or 2 · C grade or better</text>
</g>
<g transform="translate(60,404)">
<rect x="0" y="-20" rx="10" width="30" height="30" fill="#8a63ff"/>
<text x="46" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#12152b">Numeracy</text>
<text x="620" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="900" fill="#12152b">10 credits</text>
<text x="790" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#697386">Stage 1 or 2 · C grade or better</text>
</g>
<g transform="translate(60,456)">
<rect x="0" y="-20" rx="10" width="30" height="30" fill="#17a37b"/>
<text x="46" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#12152b">Activating Identities &amp; Futures</text>
<text x="620" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="900" fill="#12152b">10 credits</text>
<text x="790" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#697386">Stage 2 compulsory</text>
</g>
<g transform="translate(60,508)">
<rect x="0" y="-20" rx="10" width="30" height="30" fill="#f6c453"/>
<text x="46" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#12152b">Stage 2 subjects</text>
<text x="620" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="900" fill="#12152b">60+ credits</text>
<text x="790" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#697386">At least 60 credits at Stage 2</text>
</g>
<g transform="translate(60,560)">
<rect x="0" y="-20" rx="10" width="30" height="30" fill="#c9cede"/>
<text x="46" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#12152b">Your choice of subjects &amp; courses</text>
<text x="620" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="900" fill="#12152b">90 credits</text>
<text x="790" y="3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#697386">Stage 1 or 2, including VET</text>
</g>
<text x="60" y="620" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#697386">Most subjects are worth 10 credits per semester or 20 credits for a full year. Source: sace.sa.edu.au</text>
</svg>