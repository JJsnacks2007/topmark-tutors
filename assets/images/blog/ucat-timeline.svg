<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-label="UCAT ANZ 2026 key dates timeline">
<rect width="1160" height="470" fill="#fbf7ee"/>
<text x="60" y="70" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#12152b" letter-spacing="-1">UCAT 2026 key dates</text>
<text x="60" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#697386">Results from the 2026 sitting are used for 2027 university entry</text>
<line x1="100" y1="300" x2="1060" y2="300" stroke="#12152b" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round"/>

