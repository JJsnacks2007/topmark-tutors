<text x="0" y="237" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#697386" text-anchor="middle">Standard booking</text>
<text x="0" y="355" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#697386" text-anchor="middle">deadline</text>
