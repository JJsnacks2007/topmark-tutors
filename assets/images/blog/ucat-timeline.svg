<text x="60" y="440" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#697386">Late bookings close 29 May (extra fee applies). Standard fee AU$335 · concession AU$240. Source: ucat.edu.au</text>
